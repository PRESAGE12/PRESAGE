<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>PRESAGE – Actus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">

  <!-- Police Montserrat (Google Fonts). Hors ligne : polices de secours (voir style.css). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap">

  <link rel="stylesheet" href="actus.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>

  <!-- Jeu d'icônes météo (statique, de confiance) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-sun" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="11"/>
        <path d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4.2 4.2M44.8 44.8l4.2 4.2M15 49l4.2-4.2M44.8 19.2L49 15"/>
      </symbol>
      <symbol id="i-moon" viewBox="0 0 64 64">
        <path d="M42 10a23 23 0 1 0 12 40A19 19 0 0 1 42 10z"/>
      </symbol>
      <symbol id="i-cloud" viewBox="0 0 64 64">
        <path d="M20 48h26a11 11 0 0 0 1.6-21.9A15 15 0 0 0 18.6 29 9.5 9.5 0 0 0 20 48z"/>
      </symbol>
      <symbol id="i-partly" viewBox="0 0 64 64">
        <circle cx="24" cy="22" r="8"/>
        <path d="M24 6v4M8 22h4M12.7 10.7l2.8 2.8M35.3 10.7l-2.8 2.8"/>
        <path d="M26 54h24a9.5 9.5 0 0 0 1.4-18.9A13 13 0 0 0 25.6 37 8.5 8.5 0 0 0 26 54z"/>
      </symbol>
      <symbol id="i-fog" viewBox="0 0 64 64">
        <path d="M20 36h26a9 9 0 0 0 1.3-17.9A13 13 0 0 0 19 21 8 8 0 0 0 20 36z"/>
        <path d="M12 44h40M18 52h28"/>
      </symbol>
      <symbol id="i-rain" viewBox="0 0 64 64">
        <path d="M20 38h26a9.5 9.5 0 0 0 1.4-18.9A13.5 13.5 0 0 0 19 22 8.5 8.5 0 0 0 20 38z"/>
        <path d="M22 46l-3 8M34 46l-3 8M46 46l-3 8"/>
      </symbol>
      <symbol id="i-snow" viewBox="0 0 64 64">
        <path d="M20 38h26a9.5 9.5 0 0 0 1.4-18.9A13.5 13.5 0 0 0 19 22 8.5 8.5 0 0 0 20 38z"/>
        <path d="M22 47v.1M34 47v.1M46 47v.1M28 56v.1M40 56v.1" stroke-width="6"/>
      </symbol>
      <symbol id="i-storm" viewBox="0 0 64 64">
        <path d="M20 38h26a9.5 9.5 0 0 0 1.4-18.9A13.5 13.5 0 0 0 19 22 8.5 8.5 0 0 0 20 38z"/>
        <path d="M35 40l-8 11h9l-5 10"/>
      </symbol>
    </defs>
  </svg>

  <div id="stage">

    <!-- Fond photo + voile -->
      <div id="photo">
        <section id="photos-presage" data-photos-carousel data-base="../"></section>
      </div>

    <!-- Panneau bleu incliné + pied de page blanc -->
    <div id="panneau-bleu"></div>
    <div id="pied"></div>
    <img id="logo-ufr" src="../assets/ufr3s_logo.png" alt="UFR3S Médecine – Université de Lille">

    <!-- Logo PRESAGE — animation à l'entrée seulement (jamais rejouée) -->
    <div id="logo-presage" data-anim-entree="droite" style="--delai:.15s">
      <div class="ombre"></div>
      <img src="../assets/presage_logo.png" alt="PRESAGE">
    </div>

    <!-- Horloge — animation à l'entrée seulement (jamais rejouée) -->
    <div id="horloge" data-anim-entree="droite" style="--delai:.05s">
      <span id="heure">--:--</span>
    </div>

    <!-- En-tête -->
    <h1 id="titre" data-anim="gauche" style="--delai:0s">Actus</h1>
    <div id="trait" data-anim="gauche" style="--delai:.05s"></div>
    <div id="date" data-anim="gauche" style="--delai:.1s">&nbsp;</div>

    <!-- Fond translucide derrière les cartes -->
    <div id="panneau-cartes"></div>

    <!-- Carte : fête du jour -->
    <section class="carte" id="carte-fete" data-anim="gauche" style="--delai:.15s">
      <h2>Fête du jour</h2>
      <div class="corps">
        <div class="fete-nom" id="fete-nom">—</div>
      </div>
    </section>

    <!-- Carte : qualité de l'air -->
    <section class="carte" id="carte-air" data-anim="gauche" style="--delai:.25s">
      <h2>Qualité de l'air</h2>
      <div class="corps">
        <div class="air-ligne">
          <span class="air-pastille" id="air-pastille"></span>
          <span class="air-label" id="air-label">—</span>
        </div>
        <div class="air-detail" id="air-detail">&nbsp;</div>
        <div class="air-jauge" id="air-jauge">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </section>

    <!-- Carte : actus 

 -->
    <section class="carte" id="carte-actus" data-anim="gauche" style="--delai:.35s">
      <h2>Actus LinkedIn</h2>
      <div class="corps">
        <div id="linkedin-carousel" class="linkedin-carousel" data-linkedin-carousel data-base="../" tabindex="0" aria-label="Navigation des actualités LinkedIn"></div>
      </div>
    </section>

    <!-- Carte : météo -->
    <section class="carte" id="carte-meteo" data-anim="droite" style="--delai:.2s">
      <h2>Météo</h2>
      <div class="corps">
        <div class="m-actuel">
          <svg class="ico m-icone" id="m-icone" aria-hidden="true"><use href="#i-cloud"/></svg>
          <div class="m-temp" id="m-temp">--°</div>
        </div>
        <div class="m-cond" id="m-cond">—</div>
        <div class="m-minmax" id="m-minmax">&nbsp;</div>
        <div class="m-details">
          <div><span>Ressenti</span><b id="m-ressenti">--°</b></div>
          <div><span>Vent</span><b id="m-vent">-- km/h</b></div>
          <div><span>Humidité</span><b id="m-humidite">-- %</b></div>
        </div>
        <div class="m-jours" id="m-jours"></div>
      </div>
    </section>

  </div>

  <link rel="stylesheet" href="../css/photos-carousel.css">
  <link rel="stylesheet" href="actus-linkedin.css">
  <script src="../js/photos-carousel.js" defer></script>
  <script src="actus-linkedin.js" defer></script>
  <script src="actus.js"></script>


<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
